// 4 x 4 circuit puzzle: a winding route that uses every tile. Path entrance at (0,1), exit at (3,1).
const R=4,C=4;const path=[[0,1],[0,0],[1,0],[2,0],[3,0],[3,1]];let cell={};const dirs=[[0,-1],[1,0],[0,1],[-1,0]];function keyCell(x,y){return `${x},${y}`};
function initHack(){let grid=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++)grid.push({x,y,connections:[0,2],rotation:Math.floor(rnd(0,4))});for(let i=0;i<path.length;i++){let [x,y]=path[i],prev=path[i-1]||[-1,1],next=path[i+1]||[4,1];let from=dirs.findIndex(([dx,dy])=>x+dx===prev[0]&&y+dy===prev[1]),to=dirs.findIndex(([dx,dy])=>x+dx===next[0]&&y+dy===next[1]);let g=grid[y*C+x];g.connections=[from,to];g.rotation=Math.floor(rnd(1,4))}state={grid,timer:95,p:{x:480,y:280}};setBtns('','','',false);notice('TOCA LOS CUADROS PARA GIRAR LOS CABLES',3)}
function getPorts(g){return g.connections.map(d=>(d+g.rotation)%4)}
function getCircuit(){let g=state.grid,start=g[C*1],seen=new Set(),queue=[[0,1]];if(!getPorts(start).includes(3))return{win:false,seen};while(queue.length){let [x,y]=queue.shift(),k=keyCell(x,y);if(seen.has(k))continue;seen.add(k);let tile=g[y*C+x];for(let d of getPorts(tile)){let nx=x+dirs[d][0],ny=y+dirs[d][1];if(x===C-1&&y===1&&d===1)return{win:true,seen};if(nx<0||nx>=C||ny<0||ny>=R)continue;if(getPorts(g[ny*C+nx]).includes((d+2)%4))queue.push([nx,ny])}}return{win:false,seen}}

function bossStep(dt){let s=state,p=s.p,b=s.boss;move(p,dt,p.dash>0?510:214,{x0:45,x1:925,y0:94,y1:480});p.dash-=dt;p.inv-=dt;p.cd-=dt;s.cd-=dt;if(pressed.b&&p.cd<=0){p.dash=.22;p.inv=.3;p.cd=2.7;beep(340)}if(pressed.d&&!s.med){s.med=true;p.hp=Math.min(160,p.hp+58);notice('BOTIQUÍN UTILIZADO +58',2);beep(900)}if(pressed.a&&s.cd<=0){s.cd=.16;let d=dist(p,b);if(d<500){b.hp-=2.8;sparks(b.x+rnd(-10,10),b.y+rnd(-10,10),'#ffd86e',2);beep(660,45)}}if(b.hp<=0){complete();return}let phase=b.hp<85?3:b.hp<175?2:1;if(phase>b.phase){b.phase=phase;notice('FASE '+phase+' · EL JEFE CAMBIA DE PATRÓN',3);if(phase===3){p.hp=Math.min(160,p.hp+25);p.inv=1.5;notice('??? : TE CUBRO. ACABA CON ÉL.',3)}}b.shot-=dt;b.charge-=dt;if(b.shot<=0){b.shot=(phase===1?1.5:phase===2?1.15:.8);b.pattern++;if(b.pattern%3===0){s.rings.push({x:b.x,y:b.y,r:0,life:1.5,hit:false});notice('¡ONDA EXPANSIVA! ESQUIVA',1.2)}else{let d=Math.atan2(p.y-b.y,p.x-b.x),count=phase===1?3:phase===2?5:7;for(let i=0;i<count;i++){let a=d+(i-(count-1)/2)*.21;s.shots.push({x:b.x,y:b.y,vx:Math.cos(a)*(220+phase*52),vy:Math.sin(a)*(220+phase*52),life:3})}}}for(let i=s.shots.length-1;i>=0;i--){let o=s.shots[i];o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;if(dist(o,p)<19){hitHero(19+phase*2);o.life=0}if(o.life<=0)s.shots.splice(i,1)}for(let i=s.rings.length-1;i>=0;i--){let o=s.rings[i];o.r+=350*dt;o.life-=dt;if(Math.abs(dist(o,p)-o.r)<18&&!o.hit&&p.inv<=0){o.hit=true;hitHero(26)}if(o.life<=0)s.rings.splice(i,1)}b.x=660+Math.sin(t*1.7)*65;b.y=240+Math.cos(t*1.4)*60}

let endingStage=0;function ending(){mode='ending';persist.won=true;save();endingStage=0;show(`<div class="eyebrow victory">DISTRITO 14 · CASO CERRADO</div><h1 class="hero">MISIÓN<br><span>COMPLETADA</span></h1><p>Has conseguido acabar con el Guardián. El teléfono que llevabas vibra por última vez.</p><div class="phone"><div class="contact">📟 CONTACTO DESCONOCIDO</div><div class="bubble">Bueno, Ariel. Al final te lo has pasado.</div><div class="bubble">Te he hecho correr, pelear, pensar y matar zombis.</div><div class="bubble">Pero te falta una cosa por descubrir...</div></div><div class="btns">${button('▶ DESCUBRIR QUIÉN ESTÁ DETRÁS','reveal')}</div>`);attach()}
actions.reveal=()=>{mode='reveal';beep(820,220,'triangle',.12);show(`<div class="eyebrow">IDENTIFICANDO CONTACTO DESCONOCIDO... 100%</div><h2>ERA MARINA.</h2><div class="duo"><div>${portrait(false)}<div class="duo-name">ARIEL</div></div><div>${portrait(true)}<div class="duo-name">MARINA</div></div></div><div class="phone"><div class="contact">📟 CONTACTO DESCONOCIDO → MARINA</div><div class="bubble">JAJAJA ¿pensabas que te iba a dar el regalo sin hacerte sufrir un poco?</div><div class="bubble">Te queda una última cosa. Abre el maletín.</div></div><div class="btns">${button('🎁 ABRIR EL MALETÍN','ticket')}</div>`);attach()};
actions.ticket=()=>{mode='ticket';beep(1080,350,'triangle',.14);show(`<div class="eyebrow victory">RECOMPENSA OCULTA · DISTRITO 14</div><h1 class="hero"><span>RESPETO +100</span></h1><div class="ticket-final"><div class="two">DOS PLAZAS CONFIRMADAS EN TU PRÓXIMA MISIÓN</div><strong>YUNG BEEF</strong><p style="font-size:22px;color:#fff;font-weight:900;margin:5px">NOS VAMOS DE CONCIERTO.</p><p>Un mes antes de tu cumpleaños. Primera sorpresa.</p></div><div class="phone"><div class="contact">📟 MARINA</div><div class="bubble">Sí, te he programado un juego entero para darte las entradas. Y encima has tenido que currártelo JAJAJA.</div></div><div class="btns"><a class="btn" href="https://www.youtube.com/watch?v=o1gan3141Y4" target="_blank" rel="noopener noreferrer">♫ ESCUCHAR READY PA MORIR ↗</a>${button('🏆 VOLVER AL MENÚ','menu',true)}</div><div class="credit">Al tocar ESCUCHAR se abre el videoclip oficial de la canción en YouTube. Los códigos de acceso reales al concierto se entregan por separado.</div>`);attach();for(let j=0;j<85;j++)sparks(rnd(0,960),rnd(0,540),pick(['#ffcc6c','#45e8ef','#ff64bc']),2)};
// TOUCH: joystick for movement, three always-visible action buttons. Tap canvas only on hack screen.
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;function resetJoy(){joy.x=joy.y=0;nub.style.transform='translate(0,0)'}function stickMove(e){const rect=stick.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.max(1,Math.hypot(dx,dy)),lim=rect.width*.32;joy.x=clamp(dx/lim,-1,1);joy.y=clamp(dy/lim,-1,1);const norm=Math.min(1,lim/mag);nub.style.transform=`translate(${dx*norm}px,${dy*norm}px)`}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});for(let typ of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(typ,()=>{stickId=null;resetJoy()});
for(let [el,k] of [[a1,'a'],[a2,'b'],[a3,'d']]){el.addEventListener('pointerdown',e=>{pressed[k]=true;el.setPointerCapture(e.pointerId);e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>pressed[k]=false)}
cv.addEventListener('pointerdown',e=>{if(mode==='play'&&stage===4){let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;hackTap(x,y)} });
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' ','w','a','s','d','j','k','l','e','shift'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')key.left=true;if(k==='arrowright'||k==='d')key.right=true;if(k==='arrowup'||k==='w')key.up=true;if(k==='arrowdown'||k==='s')key.down=true;if(k==='j'||k===' ')pressed.a=true;if(k==='k'||k==='shift')pressed.b=true;if(k==='l'||k==='e')pressed.d=true});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')key.left=false;if(k==='arrowright'||k==='d')key.right=false;if(k==='arrowup'||k==='w')key.up=false;if(k==='arrowdown'||k==='s')key.down=false;if(k==='j'||k===' ')pressed.a=false;if(k==='k'||k==='shift')pressed.b=false;if(k==='l'||k==='e')pressed.d=false});
function backdrop(){city();cityFX();neonDetails();px(0,0,W,H,'#07132391');px(38,100,380,280,'#09102095');txt('DISTRITO',58,196,42,'#8a9fb0');txt('14',58,286,115,'#f4b65a');actor(710,300,false,5);px(0,495,W,45,'#070d19bc')}
function frame(now){let dt=Math.min(.034,(now-last)/1000||0);last=now;if(mode==='play'){t+=dt;toastTimer-=dt;if(toastTimer<=0)toast.classList.remove('show');if(stage===0)zombieStep(dt);else if(stage===1)chaseStep(dt);else if(stage===2)warehouseStep(dt);else if(stage===3)fightStep(dt);else if(stage===4)hackStep(dt);else if(stage===5)bossStep(dt);if(mode==='play'){if(stage===0)zombieDraw();if(stage===1)chaseDraw();if(stage===2)warehouseDraw();if(stage===3)fightDraw();if(stage===4)hackDraw();if(stage===5)bossDraw();drawParticles(dt);sub.textContent=levels[stage].name;st.textContent=`MISIÓN ${stage+1} / 6`} }else{t+=dt;if(!['ending','reveal','ticket'].includes(mode))backdrop();drawParticles(dt)}prev.d=pressed.d;prev.a=pressed.a;requestAnimationFrame(frame)}
menu();requestAnimationFrame(frame);
})();
